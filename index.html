<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GNSS V19</title><style>body{font:15px system-ui,sans-serif;margin:auto;padding:18px;max-width:1000px;background:#f3f5f8;color:#243044}section{background:white;border:1px solid #ccd4df;border-radius:9px;padding:15px;margin:12px 0}button{background:#1769aa;color:white;border:0;border-radius:5px;padding:8px 12px;margin:3px;cursor:pointer}input,select{padding:7px;max-width:100%;border:1px solid #9aa5b5;border-radius:5px}label{display:inline-flex;flex-direction:column;gap:4px;margin:5px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #dde2ea;padding:6px;text-align:left}h1{font-size:23px}.muted{color:#626e7e}.hidden{display:none}.danger{background:#b42318}.good{color:green}.bad{color:#b42318}.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{border:1px solid #ccd4df;padding:10px;border-radius:8px;margin:9px 0}</style></head><body><h1>GNSS単点観測・精度管理 V19</h1><p class="muted">GitHub Pages版／端末内保存。仕事での使用前に元データとの照合を行ってください。</p><main id="home"><section><h2>案件作成</h2><label>現場名<input id="name"></label><label>案件番号<input id="case"></label><button onclick="create()">作成</button></section><section><h2>案件一覧</h2><div id="projects"></div></section><section><h2>保存と復元</h2><button onclick="GNSSStore.backup()">全案件をJSONで保存</button><label>バックアップJSON<input type=file id="restore" accept=".json" onchange="GNSSStore.restore(this.files[0]).catch(err=>alert(err.message))"></label><p class=muted>PCとスマホでデータは自動同期されません。</p></section><section><h2>初期設定</h2><label>グループ距離(m)<input type=number id=threshold step=.01></label><label>精度区分<select id=precision><option>甲二</option><option>甲三</option><option>乙一</option><option>乙二</option><option>乙三</option></select></label><label>座標系<input type=number id=cs min=1 max=19></label><button onclick="saveSettings()">保存</button></section></main><main id="work" class=hidden><section class=flex><h2 id="title"></h2><button onclick="back()">案件一覧</button><button onclick="GNSSStore.backup()">JSON保存</button><button onclick="GNSSStore.sima(pid)">SIMA出力</button><button onclick="window.open('network.html?id='+encodeURIComponent(pid))">基準点網図</button><button onclick="window.open('report.html?id='+encodeURIComponent(pid))">精度管理報告書</button></section><section><h2>データ読込</h2><label>GNSS GPX<input id=gpx type=file accept=".gpx" multiple onchange="upload('upload',this)"></label><label>SIMA座標<input id=sima type=file accept=".sim,.sima,.txt" onchange="upload('sima-upload',this)"></label><p class=muted>GPXは座標変換情報に平面直角座標X・Yを含む形式に対応。</p></section><section><h2>既知点</h2><div class=flex><label>点名<input id=kname></label><label>成果X<input id=kx type=number step=.001></label><label>成果Y<input id=ky type=number step=.001></label><label>標高<input id=kh type=number step=.001></label><button onclick="addKnown()">追加</button></div><div id=known></div></section><section><h2>新点・本観測・点検観測</h2><button onclick="addNew()">新点を追加</button><div id=newpoints></div></section><section><h2>TS距離点検</h2><div id=distances></div></section><section><h2>観測グループ一覧</h2><div id=groups></div></section></main><script src="storage.js"></script><script>
const $=id=>document.getElementById(id);let pid='',S=null;const f=(v,n=3)=>v==null?'':Number(v).toFixed(n);
async function api(path,method='GET',body=null){let options={method};if(body instanceof FormData)options.body=body;else if(body!==null){options.body=JSON.stringify(body);options.headers={'Content-Type':'application/json'}}const r=await fetch('/api/'+path,options),data=await r.json();if(!r.ok||data.ok===0)throw Error(data.error||'失敗');return data}
async function home(){const p=await api('projects');$('projects').innerHTML=p.map(x=>'<div class=card><b>'+esc(x.name)+'</b>　'+esc(x.case_no)+' <button onclick="openProject(\''+x.id+'\')">開く</button><button class=danger onclick="del(\''+x.id+'\')">削除</button></div>').join('')||'案件なし';const s=await api('settings');$('threshold').value=s.grouping_threshold;$('precision').value=s.precision_class;$('cs').value=s.coordinate_system}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function create(){try{const r=await api('projects','POST',{name:$('name').value,case_no:$('case').value});openProject(r.id)}catch(e){alert(e.message)}}
async function saveSettings(){await api('settings','POST',{grouping_threshold:$('threshold').value,precision_class:$('precision').value,coordinate_system:$('cs').value});alert('保存しました')}
async function del(id){if(confirm('案件を削除しますか？')){await api('projects/'+id,'DELETE');home()}}
async function openProject(id){pid=id;$('home').classList.add('hidden');$('work').classList.remove('hidden');await load()}
function back(){$('work').classList.add('hidden');$('home').classList.remove('hidden');home()}
async function load(){S=await api('project/'+pid+'/state');$('title').textContent=S.project.name;render()}
async function post(path,data){await api('project/'+pid+'/'+path,'POST',data);await load()}
async function upload(action,el){if(!el.files.length)return;try{const fd=new FormData();for(const file of el.files)fd.append('file',file);const r=await api('project/'+pid+'/'+action,'POST',fd);el.value='';await load();alert('読込完了 '+JSON.stringify(r))}catch(e){alert(e.message)}}
async function addKnown(){try{await post('known',{name:$('kname').value,result_x:$('kx').value,result_y:$('ky').value,result_h:$('kh').value})}catch(e){alert(e.message)}}
async function addNew(){await post('new-point',{})}
async function remove(type,id){if(!confirm('削除しますか？'))return;await api('project/'+pid+'/'+type+'/'+id,'DELETE');await load()}
function groupsSelect(selected){return '<option value="">未選択</option>'+S.groups.map(g=>'<option value="'+g.id+'" '+(selected===g.id?'selected':'')+'>'+esc(g.label)+' ('+g.observations.length+'回)</option>').join('')}
function observationSelect(gid,selected,multiple=false){let g=S.groups.find(g=>g.id===gid);return '<select '+(multiple?'multiple size=6':'')+'><option value="">未選択</option>'+(g?g.observations.map(o=>'<option value="'+o.id+'" '+(selected?.includes(o.id)?'selected':'')+'>'+esc(o.point_name)+'　'+esc(o.observed_at)+'　X='+f(o.x)+' Y='+f(o.y)+'</option>').join(''):'')+'</select>'}
function render(){let lim=S.rules[S.project.precision_class];$('known').innerHTML=S.known_points.map(k=>{let l=S.known_links[k.id]||{},g=S.groups.find(x=>x.id===l.group_id),a=g?.observations.find(x=>x.id===l.obs1_id),b=g?.observations.find(x=>x.id===l.obs2_id),diff=a&&b?Math.max(Math.abs((a.x+b.x)/2-k.result_x),Math.abs((a.y+b.y)/2-k.result_y))*1000:null;return '<div class=card><b>'+esc(k.name)+'</b> 成果 X='+f(k.result_x)+' Y='+f(k.result_y)+' <button class=danger onclick="remove(\'known\',\''+k.id+'\')">削除</button><div>グループ <select onchange="knownGroup(\''+k.id+'\',this.value)">'+groupsSelect(l.group_id)+'</select></div><div>観測を2つ選択 <span id="known_'+k.id+'">'+observationSelect(l.group_id,[l.obs1_id,l.obs2_id],true)+'</span><button onclick="knownPick(\''+k.id+'\')">確定</button></div>'+(diff==null?'':'<div class="'+(diff<=lim?'good':'bad')+'">既知点較差 最大 '+diff.toFixed(0)+'mm ／許容 '+lim+'mm</div>')+'</div>'}).join('');
$('newpoints').innerHTML=S.new_points.map(n=>{let g=S.groups.find(x=>x.id===n.group_id),a=g?.observations.find(x=>x.id===n.main1_id),b=g?.observations.find(x=>x.id===n.main2_id),c=g?.observations.find(x=>x.id===n.check1_id),d=g?.observations.find(x=>x.id===n.check2_id),dx=a&&b?Math.abs(a.x-b.x)*1000:null,dy=a&&b?Math.abs(a.y-b.y)*1000:null;return '<div class=card><b>'+esc(n.name)+'</b><button class=danger onclick="remove(\'new-point\',\''+n.id+'\')">削除</button><div>グループ <select onchange="newGroup(\''+n.id+'\',this.value)">'+groupsSelect(n.group_id)+'</select></div><div>本観測2点 <span id="main_'+n.id+'">'+observationSelect(n.group_id,[n.main1_id,n.main2_id],true)+'</span><button onclick="assign(\''+n.id+'\',\'main\')">設定</button></div><div>点検観測2点 <span id="check_'+n.id+'">'+observationSelect(n.group_id,[n.check1_id,n.check2_id],true)+'</span><button onclick="assign(\''+n.id+'\',\'check\')">設定</button></div>'+(dx==null?'':'<div class="'+(dx<=20&&dy<=20?'good':'bad')+'">本観測較差 ΔX '+dx.toFixed(0)+'mm ΔY '+dy.toFixed(0)+'mm (20mm以内)　採用X '+f((a.x+b.x)/2)+' Y '+f((a.y+b.y)/2)+'</div>')+(c&&d&&a&&b?'<div>点検平均較差 ΔX '+f(Math.abs((c.x+d.x-a.x-b.x)/2)*1000,0)+'mm ΔY '+f(Math.abs((c.y+d.y-a.y-b.y)/2)*1000,0)+'mm</div>':'')+'</div>'}).join('');
$('groups').innerHTML=S.groups.map(g=>'<div class=card><b>'+esc(g.label)+'</b><table><tr><th>点名</th><th>観測日時</th><th>X</th><th>Y</th></tr>'+g.observations.map(o=>'<tr><td>'+esc(o.point_name)+'</td><td>'+esc(o.observed_at)+'</td><td>'+f(o.x,4)+'</td><td>'+f(o.y,4)+'</td></tr>').join('')+'</table></div>').join('');
const p=S.new_points.map(n=>{let g=S.groups.find(x=>x.id===n.group_id),a=g?.observations.find(x=>x.id===n.main1_id),b=g?.observations.find(x=>x.id===n.main2_id);return a&&b?{id:n.id,name:n.name,x:(a.x+b.x)/2,y:(a.y+b.y)/2}:null}).filter(Boolean);
$('distances').innerHTML=p.slice(1).map((to,i)=>{let from=p[i],dist=Math.hypot(to.x-from.x,to.y-from.y),r=S.distance_checks.find(d=>d.from_point_id===from.id&&d.to_point_id===to.id);return '<div class=card><b>'+from.name+'－'+to.name+'</b> 座標距離 '+f(dist)+'m <label>TS距離(m)<input type=number step=.001 id="ts_'+i+'" value="'+(r?.ts_distance??'')+'"></label><label>地形<select id="tr_'+i+'"><option value=flat>平地</option><option value=mountain '+(r?.terrain==='mountain'?'selected':'')+'>山地</option></select></label><button onclick="saveDistance(\''+from.id+'\',\''+to.id+'\','+i+')">保存</button>'+(r?.ts_distance==null?'':'<div>較差 '+f(Math.abs(r.ts_distance-dist)*1000,0)+'mm</div>')+'</div>'}).join('')||'採用座標を持つ新点が2点以上必要'}
async function knownGroup(id,group){await post('known-link',{known_point_id:id,group_id:group})}
async function knownPick(id){let el=$('known_'+id).querySelector('select'),arr=[...el.selectedOptions].map(x=>x.value).filter(Boolean);if(arr.length!==2)return alert('2観測を選択してください');let l=S.known_links[id];await post('known-link',{known_point_id:id,group_id:l.group_id,obs1_id:arr[0],obs2_id:arr[1]})}
async function newGroup(id,group){await post('new-link',{id,group_id:group})}
async function assign(id,kind){let el=$(kind+'_'+id).querySelector('select'),arr=[...el.selectedOptions].map(x=>x.value).filter(Boolean);if(arr.length!==2)return alert('2観測を選択してください');let n=S.new_points.find(x=>x.id===id),data={...n,id};if(kind==='main'){data.main1_id=arr[0];data.main2_id=arr[1]}else{data.check1_id=arr[0];data.check2_id=arr[1]}await post('new-link',data)}
async function saveDistance(from_point_id,to_point_id,i){await post('distance-check',{from_point_id,to_point_id,ts_distance:$('ts_'+i).value,terrain:$('tr_'+i).value})}
home().catch(e=>alert(e.message));
</script></body></html>
