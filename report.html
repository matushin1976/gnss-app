<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GNSS精度管理報告書</title><style>body{font:14px system-ui;margin:20px;color:#222}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #aaa;padding:7px;text-align:left}button{padding:9px;background:#1769aa;color:white;border:0;border-radius:5px}.ok{color:green}.ng{color:#b42318}@media print{button{display:none}@page{size:A4 portrait;margin:15mm}}</style></head><body><button onclick="print()">PDF保存・印刷</button><h1>GNSS単点観測 精度管理報告書</h1><div id=info></div><h2>既知点の整合性</h2><table><thead><tr><th>点名</th><th>ΔX (mm)</th><th>ΔY (mm)</th><th>許容値 (mm)</th><th>判定</th></tr></thead><tbody id=known></tbody></table><h2>新点・本観測点検</h2><table><thead><tr><th>点名</th><th>採用X</th><th>採用Y</th><th>本観測較差 X/Y (mm)</th><th>点検較差 X/Y (mm)</th></tr></thead><tbody id=newpoints></tbody></table><h2>TS距離点検</h2><table><thead><tr><th>区間</th><th>座標距離</th><th>TS距離</th><th>差(mm)</th><th>判定</th></tr></thead><tbody id=dist></tbody></table><p>注意：自動算出結果です。観測条件、作業規程、成果採否は技術者が確認してください。</p><script src=storage.js></script><script>
const f=(x,n=3)=>x==null?'-':Number(x).toFixed(n),e=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
(async()=>{const pid=new URLSearchParams(location.search).get('id'),r=await fetch('/api/project/'+pid+'/state'),s=await r.json(),g=id=>s.groups.find(z=>z.id===id),obs=(group,id)=>group?.observations.find(z=>z.id===id),limit=s.rules[s.project.precision_class];document.getElementById('info').innerHTML='<p>案件：'+e(s.project.name)+'　案件番号：'+e(s.project.case_no)+'<br>精度区分：'+e(s.project.precision_class)+'　座標系：'+e(s.project.coordinate_system)+'<br>観測方法：'+e(s.project.observation_method)+'</p>';
document.getElementById('known').innerHTML=s.known_points.map(k=>{const l=s.known_links[k.id]||{},a=obs(g(l.group_id),l.obs1_id),b=obs(g(l.group_id),l.obs2_id),dx=a&&b?((a.x+b.x)/2-k.result_x)*1000:null,dy=a&&b?((a.y+b.y)/2-k.result_y)*1000:null,ok=dx!=null&&Math.abs(dx)<=limit&&Math.abs(dy)<=limit;return '<tr><td>'+e(k.name)+'</td><td>'+f(dx,0)+'</td><td>'+f(dy,0)+'</td><td>'+limit+'</td><td class="'+(ok?'ok':'ng')+'">'+(dx==null?'未実施':ok?'範囲内':'範囲外')+'</td></tr>'}).join('');
const used=[];document.getElementById('newpoints').innerHTML=s.new_points.map(n=>{const h=g(n.group_id),a=obs(h,n.main1_id),b=obs(h,n.main2_id),c=obs(h,n.check1_id),d=obs(h,n.check2_id);let x=a&&b?(a.x+b.x)/2:null,y=a&&b?(a.y+b.y)/2:null;if(x!=null)used.push({...n,x,y});let dd=a&&b?f(Math.abs(a.x-b.x)*1000,0)+' / '+f(Math.abs(a.y-b.y)*1000,0):'-',dc=a&&b&&c&&d?f(Math.abs((a.x+b.x-c.x-d.x)/2)*1000,0)+' / '+f(Math.abs((a.y+b.y-c.y-d.y)/2)*1000,0):'未実施';return '<tr><td>'+e(n.name)+'</td><td>'+f(x)+'</td><td>'+f(y)+'</td><td>'+dd+'</td><td>'+dc+'</td></tr>'}).join('');
document.getElementById('dist').innerHTML=used.slice(1).map((b,i)=>{const a=used[i],d=Math.hypot(a.x-b.x,a.y-b.y),rec=s.distance_checks.find(z=>z.from_point_id===a.id&&z.to_point_id===b.id),diff=rec?.ts_distance==null?null:Math.abs(rec.ts_distance-d)*1000,lim=rec?.terrain==='mountain'?Math.max(20,d):Math.max(10,d*.5),ok=diff!=null&&diff<=lim;return '<tr><td>'+e(a.name)+' - '+e(b.name)+'</td><td>'+f(d)+'</td><td>'+f(rec?.ts_distance)+'</td><td>'+f(diff,0)+'</td><td>'+(diff==null?'未実施':ok?'範囲内':'範囲外')+'</td></tr>'}).join('')})().catch(err=>alert(err.message));
</script></body></html>
